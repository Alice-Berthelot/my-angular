<h1 [ngStyle]="{ textAlign: 'center' }">Articles</h1>

<div
  [ngStyle]="{
    display: 'flex',
    flexDirection: 'column',
    gap: '3rem',
  }"
>
  <section>
    <h2>Best article</h2>
    <article
      [ngStyle]="{
        border: '1px solid black',
        padding: '2rem',
        width: '30rem'
      }"
    >
      <h3 [ngStyle]="{ textAlign: 'center' }">
        "{{ bestArticle.title }}" - {{ bestArticle.author }}
      </h3>
    </article>
  </section>

  <h2>Add an article (standard form)</h2>
  <form
    [ngStyle]="{
      display: 'flex',
      flexDirection: 'column',
      gap: '1rem',
      width: '500px'
    }"
  >
    <label for="id">Id:</label>
    <input type="text" id="id" name="id" [(ngModel)]="articleToAdd.id" />
    <label for="title">Title:</label>
    <input
      type="text"
      id="title"
      name="title"
      [(ngModel)]="articleToAdd.title"
    />
    <label for="author">Author:</label>
    <input
      type="text"
      id="author"
      name="author"
      [(ngModel)]="articleToAdd.author"
    />
    <label for="details">Details:</label>
    <input
      type="text"
      id="details"
      name="details"
      [(ngModel)]="articleToAdd.details"
    />
    <button
      type="button"
      (click)="addArticle()"
      [ngStyle]="{
        width: '100px',
        alignSelf: 'end'
      }"
    >
      Add
    </button>
  </form>

  <h2>Add an article (reactive form)</h2>
  <app-article-form></app-article-form>

  <section>
    <h2>All articles</h2>
    <form
      [ngStyle]="{
        marginBottom: '1rem',
      }"
    >
      <label for="filter">Search: </label>
      <input type="text" id="filter" name="filter" [(ngModel)]="inputValue" />
    </form>
  
    <div
      [ngStyle]="{
        display: 'flex',
        gap: '.5rem',
        'align-items': 'baseline' 
      }"
    >
    <p>Filter:</p>
      <button
        (click)="noFilter()"
        [ngStyle]="{
          border: '1px solid',
          borderRadius: '30px',
          cursor: 'pointer',
          padding: '1rem 2rem'
        }"
      >
        All
      </button>
      <button
        (click)="filterByFivePoints()"
        [ngStyle]="{
          border: '1px solid',
          borderRadius: '50px',
          cursor: 'pointer',
          padding: '1rem'
        }"
      >
        5 points
      </button>
      <button
        (click)="filterByThreePoints()"
        [ngStyle]="{
          border: '1px solid',
          borderRadius: '50px',
          cursor: 'pointer',
          padding: '1rem'
        }"
      >
        3 points
      </button>
    </div>
    <ul
      [ngStyle]="{
        display: 'flex',
        justifyContent: 'flex-start',
        flexWrap: 'wrap',
        gap: '2rem',
        marginTop: '2rem'
      }"
    >
      <li
        *ngFor="let article of sortedArticles"
        [ngStyle]="{ 'list-style': 'none' }"
      >
        <article
          [ngClass]="{ marked: article.points > 0 }"
          *ngIf="matchInputValue(article) && displayFilteredArticles(article)"
          [ngStyle]="{
            display: 'flex',
            flexDirection: 'column',
            border: '1px solid black',
            padding: '2rem',
            width: '25rem',
            height: '18rem',
            'overflow-y': 'scroll'
          }"
        >
          <h3 [ngStyle]="{ textAlign: 'center', marginBottom: '1rem' }">
            "{{ article.title }}" - {{ article.author | titlecase }}
          </h3>
          <a
            [routerLink]="'/articles/' + article.id"
            routerLinkActive="active"
            [ngStyle]="{
              alignSelf: 'center',
              width: '15rem',
              border: '0.5px solid black',
              'padding': '.25rem 2rem',
              borderRadius: '5px',
              color: 'black',
              cursor: 'pointer',
              marginBottom: '1rem',
              textAlign: 'center',
              fontSize: '15px'
            }"
          >
            Open details in a new tab
          </a>
          <button
            (click)="showDetails(article.id)"
            [ngStyle]="{
              alignSelf: 'center',
              width: '15rem',
              border: '0.5px solid black',
              'padding': '.25rem 2rem',
              borderRadius: '5px',
              cursor: 'pointer'
            }"
          >
            See details below
          </button>
          <app-article-details
            *ngIf="detailedArticleId == article.id"
            [articleDetails]="article.details"
          ></app-article-details>
          <div
            [ngStyle]="{
              display: 'flex',
              gap: '1rem',
              marginTop: '2rem',
              alignItems: 'center'
            }"
          >
            <p [ngStyle]="{ color: 'rgb(0, ' + article.points + ', 0)' }">
              Points : {{ article.points }}
            </p>
            <button
              (click)="addPoints(article)"
              [ngStyle]="{
                borderRadius: '50px',
                width: '3rem',
                cursor: 'pointer'
              }"
            >
              +1
            </button>
            <button
              (click)="reset(article.id)"
              [ngStyle]="{
                width: '6rem',
                border: '0.5px solid black',
                cursor: 'pointer',
                'padding': '.25rem 2rem'
              }"
            >
              Reset
            </button>
          </div>
          <button
            (click)="deleteArticle(article.id)"
            [ngStyle]="{
              alignSelf: 'end',
              width: '5rem',
              border: '0.5px solid black',
              marginTop: '1rem',
              padding: '2px',
              cursor: 'pointer'
            }"
            class="delete-button"
          >
            Delete
          </button>
        </article>
      </li>
    </ul>
    <app-article-details
      (details)="handleDetails($event)"
    ></app-article-details>
  </section>

  <section
    [ngStyle]="{
      marginBottom: '3rem'
    }"
  ></section>
</div>
